[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scan-sim"
version = "0.1.0"
description = "Physically motivated office print-scan simulator for OCR test data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "scan-sim contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10.3,<13",
  "PyYAML>=6.0,<7",
  "pydantic>=2.7,<3",
  "tqdm>=4.66,<5",
  "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0",
  "types-tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/Bluboks/scan-sim"

[project.scripts]
scan-sim = "scan_sim.cli:main"
scan-sim-web = "scan_sim.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scan_sim"]

[tool.hatch.build.targets.sdist]
exclude = ["/samples/output", "/AGENTS.md", "/CLAUDE.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true


[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
