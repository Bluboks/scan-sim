# office-clean: recent MFP, clean glass, careful placement.
# Very low noise and skew, faint paper texture, normal sharpening, high JPEG quality.
# Units and meaning of every key: docs/reference/CONFIG.md.
# A two-item list [min, max] is sampled uniformly per variant; a number is fixed.

input:
  assumed_dpi: 300
  dpi_from_metadata: true
  max_page_mm: 450

working:
  dpi: 600

printer:
  color_matrix:
    - [0.995, 0.004, 0.001]
    - [0.003, 0.994, 0.003]
    - [0.001, 0.006, 0.993]
  gamma: [1.00, 1.02]
  black_density: [0.982, 0.990]
  psf:
    sigma_x: [0.25, 0.40]
    sigma_y: [0.25, 0.45]
  dot_gain:
    enabled: true
    radius_px: [0.05, 0.15]
    strength: [0.03, 0.10]
  edge_roughness_px: [0.0, 0.08]
  toner_density_noise:
    strength: [0.001, 0.004]
    scale_px: [6, 25]

paper:
  base_rgb: [0.972, 0.970, 0.962]
  low_frequency:
    strength: [0.001, 0.004]
    scale_px: [300, 1200]
  fiber:
    strength: [0.0005, 0.002]
    scale_px: [10, 40]
    elongation: [1.5, 3.0]
  fine_grain:
    strength: [0.0003, 0.001]

geometry:
  rotation_deg: [-0.08, 0.08]
  scale_x: [0.9997, 1.0003]
  scale_y: [0.9997, 1.0003]
  translation_px:
    x: [-1.0, 1.0]
    y: [-1.0, 1.0]
  perspective:
    enabled: true
    max_corner_shift_ratio: 0.0001
  # Scan area beyond the page on every side (mm); 0 = scan area equals the page.
  scan_margin_mm: 0.0
  # What shows where the skewed sheet does not cover the scan area (lid / ADF plate).
  backing:
    rgb: [0.93, 0.93, 0.93]
    brightness: [0.98, 1.02]
    texture_strength: [0.002, 0.005]
  # Thin shadow the lifted sheet edge throws onto the backing (W px).
  edge_shadow:
    strength: [0.05, 0.20]
    width_px: [2, 5]

scanner:
  dpi: 300
  resample: area
  psf:
    sigma_x: [0.25, 0.40]
    sigma_y: [0.30, 0.50]
  illumination:
    strength: [0.001, 0.005]
    edge_falloff: [0.0, 0.004]
  noise:
    gaussian_sigma: [0.0003, 0.0010]
    shot_strength: [0.0, 0.0008]
    row_sigma: [0.0, 0.0003]
    column_sigma: [0.0, 0.0002]
  color_matrix:
    - [1.002, -0.001, -0.001]
    - [-0.002, 1.004, -0.002]
    - [-0.001, 0.001, 1.000]
  white_balance:
    - [0.998, 1.004]
    - [0.998, 1.003]
    - [0.992, 1.000]
  tone:
    gamma: [1.00, 1.08]
    black_level: [0.0, 0.01]
    white_level: 1.0
  background_suppression:
    enabled: true
    threshold: [0.86, 0.92]
    strength: [0.15, 0.35]
  sharpening:
    enabled: true
    sigma: [0.45, 0.85]
    amount: [0.20, 0.45]

artifacts:
  vertical_streak:
    probability: 0.0
    strength: [0.004, 0.012]
    width_px: [1, 2]
  horizontal_banding:
    probability: 0.0
    strength: [0.002, 0.006]
    scale_px: [8, 40]

encoding:
  format: jpg
  jpeg_quality: [93, 97]
  subsampling: auto

metadata:
  save: true
